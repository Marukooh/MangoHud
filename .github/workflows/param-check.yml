name: param check

on:
  push:
    branches: [master]
    paths:
      - 'src/overlay_params.h'
      - 'README.md'
      - 'data/MangoHud.conf'
      - 'tests/params.py'
      - '.github/workflows/param-check.yml'
  pull_request:
    paths:
      - 'src/overlay_params.h'
      - 'README.md'
      - 'data/MangoHud.conf'
      - 'tests/params.py'
      - '.github/workflows/param-check.yml'

jobs:
  param-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Run Python script
      run: python tests/params.py
