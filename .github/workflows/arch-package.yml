name: Build Arch package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing fork release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    env:
      TAG: ${{ inputs.tag }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install build tools
        shell: bash
        run: |
          printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm base-devel git github-cli sudo namcap

      - uses: actions/checkout@v4

      - name: Verify release and package version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-marukooh\.[0-9]+$ ]]
          package_tag="$(bash -c 'source pkgbuild/marukooh-bin/PKGBUILD; printf "%s" "$_tag"')"
          test "$TAG" = "$package_tag"
          gh release view "$TAG" >/dev/null

      - name: Build and inspect package
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builduser
          install -d -o builduser -g builduser /tmp/mangohud-package
          cp pkgbuild/marukooh-bin/PKGBUILD pkgbuild/marukooh-bin/.SRCINFO /tmp/mangohud-package/
          chown builduser:builduser /tmp/mangohud-package/* /tmp/mangohud-package/.SRCINFO
          printf 'builduser ALL=(ALL) NOPASSWD: /usr/bin/pacman\n' > /etc/sudoers.d/builduser
          chmod 0440 /etc/sudoers.d/builduser
          sudo -u builduser bash -c 'cd /tmp/mangohud-package && makepkg --syncdeps --noconfirm'
          namcap /tmp/mangohud-package/*.pkg.tar.zst || true
          cp /tmp/mangohud-package/*.pkg.tar.zst .
          sha256sum ./*.pkg.tar.zst > mangohud-marukooh-bin.sha256

      - name: Publish package asset
        shell: bash
        run: gh release upload "$TAG" ./*.pkg.tar.zst mangohud-marukooh-bin.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mangohud-marukooh-bin-${{ inputs.tag }}
          path: |
            *.pkg.tar.zst
            mangohud-marukooh-bin.sha256
          retention-days: 30
